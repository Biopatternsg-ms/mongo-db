
version: '3.8'
services:
  mongo-db:
    image: mongo:4.4
    container_name: mongo-db-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ontologies
    volumes:
      - mongo_data:/data/db
    networks:
      - general-network

volumes:
  mongo_data:

networks:
  general-network:
    external: true
